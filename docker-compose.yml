# PostgreSQL jetable, pour les tests.
#
# Aucune des deux bases du projet ne tourne ici : le graphe (docs/adr/0006) et
# le PostgreSQL applicatif (docs/adr/0015) sont deux instances uniques sur le
# cluster Docker, 192.168.1.252.
#
# Ce conteneur existe pour une seule raison : les tests d'intégration relationnels
# appliquent puis annulent la chaîne de migrations (`alembic downgrade base`), ce
# qu'on ne fait pas sur une base que d'autres utilisent. `make test-postgres` le
# démarre et pointe dessus explicitement ; `make pg-ping`, `pg-shell` et
# `pg-migrate` visent le cluster, pas ce conteneur.
#
# Le mot de passe ci-dessous est jetable, pas un secret : celui du cluster vit
# dans backend/.env, jamais dans un fichier versionné.

services:
  postgres:
    # pgvector/pgvector plutôt que postgres : l'extension `vector` doit être
    # présente dans l'image, pas seulement activée dans la base — la migration
    # 0003 fait `CREATE EXTENSION vector` et échoue sur une image qui ne l'a
    # pas. La base du cluster a la même exigence (docs/adr/0019).
    image: pgvector/pgvector:pg17
    container_name: ea-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ea
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-developmentonly}"
      POSTGRES_DB: ea
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ea -d ea"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:

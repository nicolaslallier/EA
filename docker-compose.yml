# Bases de données locales.
#
# Le graphe d'architecture ne figure plus ici : il tourne sur le cluster Docker
# (192.168.1.252), déployé depuis `deploy/neo4j.stack.yml`. Voir docs/adr/0006.
#
# Il ne reste donc que PostgreSQL, qui n'est encore utilisé par aucun code :
# `make pg-up` le démarre le jour où l'authentification ou l'audit en aura
# besoin. Voir docs/adr/0004 pour le partage des rôles entre les deux bases.

services:
  postgres:
    image: postgres:17-alpine
    container_name: ea-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ea
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-developmentonly}"
      POSTGRES_DB: ea
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ea -d ea"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:

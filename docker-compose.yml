# Deux stores jetables, pour les tests — et pour rien d'autre.
#
# Ni l'un ni l'autre ne tourne ici pour de vrai : le PostgreSQL applicatif, qui
# porte le graphe depuis docs/adr/0033, vit dans la stack Infra, sur
# 127.0.0.1:5432 (docs/adr/0029) ; le MinIO applicatif est sur
# minio.famillelallier.net (docs/adr/0036). Personne ne modélise contre ce
# fichier.
#
# Ces conteneurs existent pour une seule raison : les tests d'intégration
# écrivent puis vident ce qu'ils y déposent — le PostgreSQL en annulant la
# chaîne de migrations (`alembic downgrade base`), le MinIO en vidant son
# bucket — ce qu'on ne fait pas sur un store que d'autres utilisent. Voir
# docs/adr/0024.
#
# `make test-integration` les démarre et pointe dessus. `make pg-ping`,
# `pg-shell` et `pg-migrate` visent l'instance partagée, pas ce conteneur.
#
# Ils ne publient que sur 127.0.0.1, et sur un autre port que celui du store
# partagé : les fixtures refusent toute autre adresse.

services:
  postgres:
    # pgvector/pgvector plutôt que postgres : l'extension `vector` doit être
    # présente dans l'image, pas seulement activée dans la base — la migration
    # 0003 fait `CREATE EXTENSION vector` et échoue sur une image qui ne l'a
    # pas. La base partagée a la même exigence (docs/adr/0019).
    image: pgvector/pgvector:pg17
    container_name: ea-postgres
    # 5433, pas 5432 : la base partagée occupe 127.0.0.1:5432 sur ce Mac, et
    # les fixtures refusent ce port (docs/adr/0029).
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ea
      POSTGRES_PASSWORD: "${POSTGRES_TEST_PASSWORD:-developmentonly}"
      POSTGRES_DB: ea
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ea -d ea"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # MinIO a fermé ses registres (quay.io/minio répond 401, minio/minio n'est
    # plus sur Docker Hub) : pgsty/minio, fork communautaire maintenu, épinglé
    # par digest. L'Infra tourne encore sur la release 2025-09-07 en cache :
    # même API S3, plus la même image.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    container_name: ea-minio
    command: ["server", "/data"]
    # 9100 : les fixtures refusent tout autre MinIO (tests/integration/throwaway.py).
    ports:
      - "127.0.0.1:${MINIO_TEST_PORT:-9100}:9000"
    environment:
      MINIO_ROOT_USER: ea-test
      MINIO_ROOT_PASSWORD: "${MINIO_TEST_PASSWORD:-developmentonly}"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  minio-data:

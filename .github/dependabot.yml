# Les mises à jour de dépendances arrivent en pull request — voir docs/adr/0026.
#
# Une PR par écosystème et par semaine pour les mineures et les correctifs,
# groupées : une file de trente PR que personne ne relit n'est pas une
# politique de mise à jour. Les majeures restent une PR chacune, parce qu'elles
# demandent qu'on lise un changelog.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]

  # Second projet Python, son propre lockfile — voir docs/adr/0028.
  - package-ecosystem: uv
    directory: /pipelines
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      javascript:
        update-types: [minor, patch]
    # TypeScript 7 casse vue-tsc et openapi-typescript (#33, annulée) : ce
    # saut-là se fait à la main, quand les deux le prennent en charge.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # jsdom 30.1.0 casse FormData.forEach sur un File (« reading '_buffer' »),
      # donc tout envoi multipart d'openapi-fetch dans Vitest : épinglé à 30.0.1.
      - dependency-name: jsdom
        versions: ["30.1.0"]

  # Les images épinglées par digest : docker-compose.yml à la racine, les deux
  # stacks du cluster, et celui de pipelines/ (docs/adr/0028).
  # Sans ceci, un digest épinglé est un correctif de sécurité qu'on ne reçoit
  # plus.
  - package-ecosystem: docker-compose
    directories:
      - /
      - /deploy
      - /pipelines
    schedule:
      interval: weekly
    # Le tag du serveur Prefect suit la version de `prefect` verrouillée dans
    # pipelines/uv.lock (test_stack.py le vérifie) : il ne bouge qu'avec elle,
    # à la main. Dependabot l'a monté seul vers 3.8.6.dev5, une préversion ;
    # un motif `versions` ne l'aurait pas exclue sans exclure 3.8.6 aussi,
    # puisque la comparaison ignore le `.devN`. Le digest du tag épinglé, lui,
    # continue d'être rafraîchi.
    ignore:
      - dependency-name: prefecthq/prefect
        update-types: [version-update:semver-patch, version-update:semver-minor, version-update:semver-major]

  # Les images de base des Dockerfile de frontend/ (construit par
  # deploy/ea.stack.yml) et de pipelines/, épinglées par tag et digest pour la
  # même raison.
  - package-ecosystem: docker
    directories:
      - /frontend
      - /pipelines
    schedule:
      interval: weekly

  # backend/ à part : son venv est construit dans l'image uv et copié dans
  # l'image python, et il ne marche que sous le Python qui l'a construit.
  # Dependabot monte chaque FROM séparément ; une montée de version mineure de
  # Python (3.12 -> 3.14) sur la seule image d'exécution a construit une API
  # qui meurt au démarrage. Les correctifs passent ; changer de Python se fait
  # à la main, dans les deux FROM à la fois.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-minor, version-update:semver-major]

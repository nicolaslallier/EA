# Intégration continue — la barrière qualité de docs/adr/0026.
#
# Les jobs appellent les cibles du Makefile plutôt que de recopier leurs
# commandes : `make check` sur un poste et ce fichier vérifient la même chose,
# et une commande qui change dans le Makefile change ici du même coup. Seuls
# les tests d'intégration font exception, parce qu'ici leurs bases sont des
# conteneurs de service GitHub et non ceux de docker-compose.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `uv sync` réécrit un lockfile périmé ; en CI c'est une erreur, pas une
  # chose à corriger en silence. `make install-be` hérite de ce réglage.
  UV_LOCKED: "1"
  NODE_VERSION: "22"
  FORCE_COLOR: "1"

jobs:
  backend:
    name: Backend — lint, types, contrat, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # setup-uv ne publie pas de tag majeur flottant : version complète.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # Node sert au contrat : `openapi-check` régénère le client TypeScript.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make install
      - run: make lint-check
      - run: make typecheck-be
      - run: make openapi-check
      # Unitaires et API, avec `--cov=ea` : le plancher de 90 % est dans
      # pyproject.toml ([tool.coverage.report] fail_under).
      - run: make test

  frontend:
    name: Frontend — types, lint, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make install-fe
      - run: make typecheck-fe
      - run: make lint-fe
      - run: make test-fe
      - run: npm run build
        working-directory: frontend

  audit:
    name: Audit — bandit, pip-audit, npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make install
      - run: make audit
      - run: make pipelines-install pipelines-audit

  pipelines:
    name: Pipelines — lint, types, tests (docs/adr/0028)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Son propre lockfile : la variation de cache ne touche pas backend/uv.lock.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pipelines/uv.lock
      - run: make pipelines-install pipelines-lint-check pipelines-typecheck pipelines-test

  integration:
    name: Intégration — PostgreSQL jetable
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # La même image que la stack Infra : un test qui passe ici doit passer
    # là-bas, contraintes et pgvector compris. Le mot de passe est jetable,
    # comme la machine.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ea
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: ea
        # 5433, le port du PostgreSQL de test en local : les fixtures refusent
        # 5432, celui de la base partagée (docs/adr/0029).
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ea -d ea"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: make install-be
      - name: pytest tests/integration
        working-directory: backend
        env:
          EA_DEBUG: "true"
          EA_POSTGRES_ENABLED: "true"
          EA_POSTGRES_HOST: 127.0.0.1
          EA_POSTGRES_PORT: "5433"
          EA_POSTGRES_PASSWORD: ci-disposable-password
          # Aucun service d'embeddings ici, et la suite n'en dépend pas : le
          # démarrage de l'application irait sinon interroger LM Studio.
          EA_EMBEDDINGS_ENABLED: "false"
        run: uv run pytest tests/integration -q

# Redéploie la stack « ea » dans Portainer après un push sur main
# (docs/adr/0044). Même montage que les dépôts Infra et DarkAngel.
#
# runs-on est le runner auto-hébergé de docker-compose.runner.yml : le Portainer
# de l'Infra est sur le LAN, un runner hébergé par GitHub ne peut pas le joindre.
# Le runner l'appelle par son URL (docs/adr/0045), sans socket Docker.
#
# N'ajoutez JAMAIS de déclencheur pull_request (ni pull_request_target) à un
# workflow qui tourne sur ce label. Le repo est public, le runner
# tient les secrets de déploiement et une PR de fork apporte son propre fichier
# de workflow : c'est de l'exécution de code arbitraire avec ces secrets.
name: Deploy

on:
  push:
    branches: [main]
    # Ce qui ne peut changer aucun conteneur ne mérite pas un redéploiement.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

# Un déploiement à la fois, et jamais annulé en vol : Portainer resterait à
# mi-redéploiement.
concurrency:
  group: deploy-ea
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, ea]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Redéployer par Portainer
        env:
          # Publics : l'API de Portainer vue du Mac, et la CA de l'Infra montée
          # par docker-compose.runner.yml, contre laquelle son certificat est vérifié.
          PORTAINER_URL: ${{ vars.PORTAINER_URL || 'https://portainer.infra.famillelallier.net' }}
          PORTAINER_CA_CERT: /etc/ea/infra-ca.crt
          # Secrets du dépôt : la clé Portainer et le jeton OpenBao (lecture de
          # infra/env). Les valeurs vivent dans le coffre, jamais recopiées ici.
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          BAO_TOKEN: ${{ secrets.BAO_TOKEN }}
          VAULT_URL: ${{ vars.VAULT_URL || 'https://vault.infra.famillelallier.net' }}
          VAULT_CA_CERT: /etc/ea/infra-ca.crt
          # Hors coffre : chemin de la CA côté Docker de l'Infra, et la clé d'accès S3.
          INFRA_CA_CERT: ${{ vars.INFRA_CA_CERT }}
          EA_S3_ACCESS_KEY: ${{ vars.EA_S3_ACCESS_KEY }}
        run: |
          set -euo pipefail
          for v in PORTAINER_API_KEY BAO_TOKEN INFRA_CA_CERT EA_S3_ACCESS_KEY; do
            [ -n "${!v}" ] || { echo "::error::$v absent (secret ou variable du dépôt)"; exit 1; }
          done
          umask 077
          export EA_STACK_ENV="$RUNNER_TEMP/ea.env"
          trap 'rm -f "$EA_STACK_ENV"' EXIT
          printf 'INFRA_CA_CERT=%s\nEA_S3_ACCESS_KEY=%s\n' "$INFRA_CA_CERT" "$EA_S3_ACCESS_KEY" > "$EA_STACK_ENV"
          scripts/vault-render-env.sh
          scripts/portainer-stack.sh up

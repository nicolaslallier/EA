[project]
name = "ea"
version = "0.1.0"
description = "Enterprise Architecture backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "mcp>=1.9",
    "neo4j>=5.26",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # Uploading a markdown file is multipart/form-data, which Starlette
    # parses only when this is installed — see docs/adr/0017.
    "python-multipart>=0.0.18",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ea"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "strict"
markers = [
    "integration: needs the cluster Neo4j — check it with `make db-ping`",
    "postgres: needs the local PostgreSQL — start it with `make pg-up`",
]
addopts = "--strict-markers"

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Alembic's template imports `op` and `sa` into every generated migration. A
# revision that happens to use only one of them is normal, not dead code, and
# stripping the import by hand on each generation is how they get forgotten.
"migrations/versions/*" = ["F401"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["ea"]

[tool.coverage.run]
source = ["src/ea"]

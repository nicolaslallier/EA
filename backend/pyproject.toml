[project]
name = "ea"
version = "0.1.0"
description = "Enterprise Architecture backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    # The embedding service is reached over HTTP, and it is the only outbound
    # call this process makes — see docs/adr/0019.
    "httpx>=0.27",
    "mcp>=1.9",
    "neo4j>=5.26",
    # The `vector` column type, and the distance operators SQLAlchemy compiles
    # `cosine_distance` into. The extension itself must be present in the
    # PostgreSQL image — see docs/adr/0019.
    "pgvector>=0.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # Uploading a markdown file is multipart/form-data, which Starlette
    # parses only when this is installed — see docs/adr/0017.
    "python-multipart>=0.0.18",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.8",
    "mypy>=1.11",
    "pip-audit>=2.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ea"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "strict"
markers = [
    "integration: needs the throwaway local Neo4j and PostgreSQL — `make test-integration` starts both",
    "postgres: needs the throwaway local PostgreSQL — start it with `make pg-up`",
]
addopts = "--strict-markers"

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Alembic's template imports `op` and `sa` into every generated migration. A
# revision that happens to use only one of them is normal, not dead code, and
# stripping the import by hand on each generation is how they get forgotten.
"migrations/versions/*" = ["F401"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["ea"]

[tool.coverage.run]
source = ["src/ea"]

[tool.coverage.report]
# The floor of CLAUDE.md, enforced rather than recited: any run that passes
# `--cov` fails under it — `make test`, `make check` and the CI all do. A
# partial run (`pytest tests/unit/test_x.py --cov=ea`) fails too, which is the
# price of the number meaning the whole suite. See docs/adr/0026.
fail_under = 90
show_missing = true
skip_covered = true

[tool.bandit]
# `make audit` runs `bandit -c pyproject.toml -r src`. Tests are excluded: they
# assert on literal passwords and bind addresses on purpose, and a scanner
# that flags every fixture is one people learn to ignore. A finding in `src`
# is silenced with `# nosec BXXX` and a comment saying why — never here.
exclude_dirs = ["tests", ".venv"]

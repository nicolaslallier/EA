# Alembic, for PostgreSQL only — the graph has no migrations (docs/adr/0004).
#
# There is deliberately no connection string here: `migrations/env.py` builds
# it from `Settings`, so the password lives in the environment and never in a
# committed file. `%(here)s` makes every path relative to this file, so the
# same commands work from `backend/` and from a test run anywhere.

[alembic]
script_location = %(here)s/migrations
# `os` rather than the legacy split on spaces, commas and colons: a checkout
# path containing any of those would otherwise be cut into several entries.
path_separator = os
prepend_sys_path = %(here)s/src

# `0002_add_users.py` sorts and reads better than a bare hash.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

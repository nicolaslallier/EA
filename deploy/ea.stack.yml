# EA — l'API et le SPA, déployés comme stack Portainer sur le Docker de l'Infra
# et servis par son NGINX, à https://ea.infra.famillelallier.net.
#
# Stack *Git* et non Web editor : les deux images se construisent depuis le
# dépôt, et seul un clone donne à Portainer de quoi les construire.
#
#   https://portainer.infra.famillelallier.net → Stacks → Add stack → Repository
#   → Repository URL : https://github.com/nicolaslallier/EA   (public, sans auth)
#   → Reference : refs/heads/main — Compose path : deploy/ea.stack.yml
#   → Environment variables : celles marquées `:?` ci-dessous
#   → Deploy the stack
#
# `make app-up` fait la même chose par l'API de Portainer, avec les variables de
# deploy/ea.env ; `make app-stack` réaffiche ces instructions. Voir docs/adr/0027.
#
# Rien ici ne publie de port : la règle d'entrée unique de l'Infra. Les deux
# conteneurs rejoignent `infra-net` sous un alias, et le vhost
# nginx/conf.d/ea.conf du dépôt Infra les atteint par ce nom.

services:
  api:
    build: ../backend
    # Reconstruire à chaque déploiement : sans ceci, compose réutilise l'image
    # déjà construite et un redéploiement après un commit sert l'ancien code.
    pull_policy: build
    restart: unless-stopped
    environment:
      EA_DEBUG: "false"
      # Le SPA et l'API partagent une origine, celle du vhost ; la liste reste
      # explicite parce que le validateur refuse `*`.
      EA_CORS_ORIGINS: https://${EA_HOSTNAME:-ea.infra.famillelallier.net}
      # Le vhost sert l'API sous /api et retire le préfixe : uvicorn doit le
      # savoir pour que /api/docs aille chercher /api/openapi.json.
      UVICORN_ROOT_PATH: /api
      # /mcp servi derrière NGINX, pour LibreChat (docs/adr/0034). Le pair TCP
      # y est toujours NGINX : la garde de boucle locale (docs/adr/0023) ne
      # distinguerait personne, elle est donc levée, et le jeton du realm
      # (docs/adr/0032) est la seule barrière — EA_AUTH_ENABLED ne se coupe
      # jamais ici. Le `Host` que NGINX transmet et la ressource annoncée par
      # le 401 sont le nom du vhost, le même que EA_CORS_ORIGINS.
      EA_MCP_ENABLED: "true"
      EA_MCP_ALLOW_REMOTE_CLIENTS: "true"
      EA_MCP_ALLOWED_HOSTS: ${EA_HOSTNAME:-ea.infra.famillelallier.net}
      EA_MCP_RESOURCE_URL: https://${EA_HOSTNAME:-ea.infra.famillelallier.net}/api/mcp

      # Chaque requête porte un jeton du realm Keycloak `ea` (docs/adr/0032).
      # Dans infra-net, keycloak.famillelallier.net est un alias de `nginx`,
      # qui présente le certificat de l'Infra : sans son CA, l'API ne lit pas
      # les clés du realm et refuse de démarrer.
      EA_AUTH_ISSUER: ${EA_AUTH_ISSUER:-https://keycloak.famillelallier.net/realms/ea}
      EA_AUTH_CA_CERT: /etc/ssl/certs/infra-ca.pem

      # Le PostgreSQL de l'Infra, sur infra-net : base et rôle `ea`, créés par
      # `make provision-app app=ea` côté Infra. Les migrations s'appliquent au
      # démarrage du conteneur (backend/Dockerfile). Il porte tout le modèle,
      # graphe compris (docs/adr/0033).
      EA_POSTGRES_HOST: ${EA_POSTGRES_HOST:-postgres}
      EA_POSTGRES_PASSWORD: ${EA_POSTGRES_PASSWORD:?EA_POSTGRES_PASSWORD est obligatoire (EA_DB_PASSWORD de l'Infra)}

      # LM Studio sur le cluster Docker (192.168.2.10), pas celui du Mac, qui
      # n'a pas le modèle. Le démarrage sonde le modèle et refuse une largeur
      # qui n'est pas celle de la colonne : un embedder injoignable empêche
      # l'API de démarrer.
      EA_EMBEDDINGS_BASE_URL: ${EA_EMBEDDINGS_BASE_URL:-http://192.168.2.10:1234/v1}
    volumes:
      - ${INFRA_CA_CERT:?INFRA_CA_CERT est obligatoire, le chemin du CA de l'Infra sur le Mac}:/etc/ssl/certs/infra-ca.pem:ro
    networks:
      infra-net:
        aliases:
          - ea-api

  web:
    build:
      context: ../frontend
      # Vite écrit ces deux valeurs dans le bundle : changer de realm ou de
      # client est une reconstruction, pas un redémarrage. L'issuer est celui
      # que l'API vérifie, lu dans la même variable.
      args:
        VITE_AUTH_AUTHORITY: ${EA_AUTH_ISSUER:-https://keycloak.famillelallier.net/realms/ea}
        VITE_AUTH_CLIENT_ID: ea-spa
    pull_policy: build
    restart: unless-stopped
    depends_on:
      - api
    networks:
      infra-net:
        aliases:
          - ea-web

networks:
  infra-net:
    external: true
